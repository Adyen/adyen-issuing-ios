name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches:
      - docs
    paths:
      - "Documentation/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs

      - name: Assemble site
        run: |
          mkdir -p _site
          # Latest docs at the site root
          if [ -d Documentation/latest/html ]; then
            cp -R Documentation/latest/html/. _site/
          fi
          # Each version under /<version>/
          if [ -f Documentation/versions.json ]; then
            for ver in $(python3 -c "import json; [print(v) for v in json.load(open('Documentation/versions.json'))]"); do
              if [ -d "Documentation/$ver/html" ]; then
                mkdir -p "_site/$ver"
                cp -R "Documentation/$ver/html/." "_site/$ver/"
              fi
            done
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
